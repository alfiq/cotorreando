[project]
name = "cotorreando"
version = "0.1.3"
description = "Dictado por voz para todo Windows con NVIDIA Parakeet."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Alfiq" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2",
    "onnxruntime-directml>=1.23",
    "PySide6-Essentials>=6.12",
    "PyAudioWPatch>=0.2.12.9",
    "livekit>=1.2",
    "cryptography>=50.0",
    "pyrage>=1.4",
    "comtypes>=1.4",
    "tokenizers>=0.23",
]

[project.optional-dependencies]
build = ["nuitka>=4.3"]
test = ["pytest>=9.2", "ruff>=0.17", "pyright>=1.1.414"]

[project.urls]
Homepage = "https://github.com/alfiq/cotorreando"

[project.gui-scripts]
cotorreando = "cotorreando.app:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cotorreando*"]

[tool.setuptools.package-data]
cotorreando = ["lora/datasets/*.txt", "lora/requirements-*.txt", "assets/*.png", "icon.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.10"
include = [
    "cotorreando/vault.py",
    "cotorreando/config.py",
    "cotorreando/model_store.py",
    "cotorreando/learning.py",
    "cotorreando/boosting.py",
    "cotorreando/transfer.py",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["graft", "dist", "_site", "build", "cotorreando.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",   # i18n strings, CSS and license tables are long on purpose; there is no formatter yet
    "B905",   # zip(strict=...) would change behavior; lengths are matched by construction
    "UP031",  # the Qt stylesheet is a %(NAME)s template filled from the palette
]
