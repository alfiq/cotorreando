[project]
name = "cotorreando"
version = "0.1.3"
description = "Dictado por voz para todo Windows con NVIDIA Parakeet."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Alfiq" }]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "onnxruntime-directml",
    "PySide6-Essentials",
    "PyAudioWPatch",
    "livekit",
    "cryptography",
    "pyrage",
    "comtypes",
    "tokenizers",
]

[project.optional-dependencies]
build = ["nuitka"]
test = ["pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/alfiq/cotorreando"

[project.gui-scripts]
cotorreando = "cotorreando.app:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cotorreando*"]

[tool.setuptools.package-data]
cotorreando = ["lora/datasets/*.txt", "lora/requirements-*.txt", "assets/*.png", "icon.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["graft", "dist", "_site", "build", "cotorreando.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",   # i18n strings, CSS and license tables are long on purpose; there is no formatter yet
    "B905",   # zip(strict=...) would change behavior; lengths are matched by construction
    "UP031",  # the Qt stylesheet is a %(NAME)s template filled from the palette
]
