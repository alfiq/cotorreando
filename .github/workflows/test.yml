name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # 3.12 installs the hashed lockfile; 3.10 resolves freely, which catches breakage from new releases.
      - if: matrix.python == '3.12'
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -e . --no-deps
      - if: matrix.python != '3.12'
        run: python -m pip install -e ".[test]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      # Aviso: no bloquea; revisa solo los módulos de datos y de cifrado listados en [tool.pyright].
      - if: matrix.python == '3.12'
        run: python -m pyright
        continue-on-error: true
      - run: python -m pytest -q
        env:
          LOCALAPPDATA: ${{ runner.temp }}   # the runner context is not available at job level
