# Al publicar una Release, sube una copia de Cotorreando-X.Y.Z-setup.exe con el nombre fijo
# Cotorreando-setup.exe. El botón de descarga del sitio apunta a
# releases/latest/download/Cotorreando-setup.exe, que así siempre da la versión más reciente.
# También se puede lanzar a mano con una etiqueta, para Releases que ya existían.
name: Instalador con nombre fijo

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Etiqueta de la Release (por ejemplo v0.1.2)
        required: true

permissions:
  contents: write

jobs:
  copiar:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Descargar el instalador con versión
        run: gh release download "$TAG" --pattern 'Cotorreando-*-setup.exe' --dir dist
      - name: Subirlo con el nombre fijo
        run: |
          cp dist/Cotorreando-*-setup.exe Cotorreando-setup.exe
          gh release upload "$TAG" Cotorreando-setup.exe --clobber
      - name: Publicar las sumas SHA-256
        shell: pwsh
        run: |
          $versionado = Get-ChildItem -Path dist -Filter 'Cotorreando-*-setup.exe' | Select-Object -First 1
          $fijo = Get-Item -Path Cotorreando-setup.exe
          $lineas = foreach ($f in @($versionado, $fijo)) {
            "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 -Path $f.FullName).Hash.ToLower(), $f.Name
          }
          $ruta = Join-Path (Get-Location) 'SHA256SUMS.txt'
          [System.IO.File]::WriteAllText($ruta, (($lineas -join "`n") + "`n"), [System.Text.UTF8Encoding]::new($false))
          gh release upload "$env:TAG" SHA256SUMS.txt --clobber
